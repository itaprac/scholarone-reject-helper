<!doctype html>
<html lang="en" data-layout="ledger">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScholarOne helper · Ledger</title>
    <link rel="stylesheet" href="/layouts.css">
  </head>
  <body class="ledger">
    <header class="topbar">
      <div class="brand"><h1>ScholarOne helper</h1><span>Ledger</span></div>
      <div id="topStatus" class="top-status" data-tone="neutral"><span class="msg">Loading…</span></div>
      <div class="newrun">
        <button class="btn primary" id="newRunBtn" type="button" aria-haspopup="menu" aria-expanded="false">New run ▾</button>
        <div class="menu" id="menu" role="menu"></div>
      </div>
    </header>

    <main class="ledger-layout">
      <aside class="ledger-side" id="counts" aria-label="ScholarOne queues"></aside>
      <div class="ledger-main">
      <div id="doctor" hidden class="doctor-line"></div>
      <div class="ledger-head">
        <h2>Runs</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="ledger" id="ledger"></div>
      </div>
    </main>

    <div class="scrim" id="scrim" data-open="false"></div>
    <aside class="drawer" id="drawer" data-open="false" role="dialog" aria-labelledby="drawerTitle" aria-hidden="true">
      <div class="drawer-head">
        <div><h3 id="drawerTitle">New run</h3><p id="drawerSub"></p></div>
        <button class="btn ghost small" id="drawerClose" type="button">Close</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot" id="drawerFoot"></div>
    </aside>

    <script src="/switcher.js"></script>
    <script src="/shared.js"></script>
    <script src="/ledger.js"></script>
  </body>
</html>
