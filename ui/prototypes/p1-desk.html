<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 Desk · ScholarOne helper</title>
<script src="./proto-data.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: oklch(97.6% 0.004 255);
  --surface: oklch(99% 0.003 255);
  --rail: oklch(95.5% 0.006 255);
  --text: oklch(25% 0.012 255);
  --muted: oklch(50% 0.015 255);
  --line: oklch(88% 0.01 255);
  --soft: oklch(95% 0.008 255);
  --accent: oklch(47% 0.125 250);
  --accent-soft: oklch(96% 0.025 250);
  --focus: oklch(47% 0.125 250 / 0.3);
  --danger: oklch(46% 0.14 28);
  --danger-bg: oklch(94% 0.025 24);
  --danger-line: oklch(78% 0.06 25);
  --positive: oklch(48% 0.09 150);
  --warn: oklch(52% 0.11 70);
  --log-bg: oklch(22% 0.025 250);
  --log-text: oklch(90% 0.025 250);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dock-h: 44px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-rows: 52px 1fr auto; grid-template-columns: 252px 1fr; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Top bar */
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 15px; font-weight: 650; }
.brand span { color: var(--muted); font-size: 12px; }
.top-status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.top-status[data-tone="active"] { color: var(--accent); }
.top-status[data-tone="error"] { color: var(--danger); font-weight: 600; }

/* Rail: queues are the navigation */
.rail {
  border-right: 1px solid var(--line); background: var(--rail); padding: 14px 10px 20px;
  overflow-y: auto; position: sticky; top: 52px; height: calc(100dvh - 52px - var(--dock-h));
}
.rail-group { margin-bottom: 14px; }
.rail-label {
  color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0 8px 6px;
}
.queue-line {
  display: flex; justify-content: space-between; align-items: center; padding: 5px 8px 3px;
  color: var(--muted); font-size: 12.5px;
}
.queue-line b { font-family: var(--mono); font-weight: 600; color: var(--text); font-size: 12.5px; }
.queue-line[data-zero="true"] b { color: var(--muted); }
.nav-item {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 7px 8px 7px 20px; border: 0; border-radius: 6px; background: transparent; color: var(--text);
  text-align: left; cursor: pointer; font-weight: 500; position: relative;
}
.nav-item::before {
  content: ""; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
  border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
}
.nav-item:hover { background: var(--soft); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.nav-item[aria-current="page"]::before { border-color: var(--accent); }
.nav-item .last { color: var(--muted); font-size: 11px; font-weight: 400; white-space: nowrap; }
.nav-item.plain { padding-left: 8px; }
.nav-item.plain::before { display: none; }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0 14px; }

/* Main */
main { padding: 22px 28px 40px; min-width: 0; }
.panel { display: none; }
.panel[data-active="true"] { display: block; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.head h2 { font-size: 18px; font-weight: 650; }
.head p { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 64ch; }
.queue-chip {
  display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); font-size: 12.5px; color: var(--muted); white-space: nowrap;
}
.queue-chip b { font-family: var(--mono); font-size: 16px; color: var(--text); }

.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px 18px; }
.card + .card { margin-top: 14px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-title h3 { font-size: 13.5px; font-weight: 650; }
.card-title .sub { color: var(--muted); font-size: 12.5px; }

.form-grid { display: grid; grid-template-columns: repeat(4, minmax(140px, 220px)); gap: 12px; }
label.field { display: grid; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
label.field.wide { grid-column: span 2; }
input, select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text);
  padding: 7px 9px; min-height: 36px; font-weight: 400;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; color: var(--text); font-size: 13px; margin-top: 12px; }
.check input { width: 15px; min-height: 15px; accent-color: var(--accent); }
details.more { margin-top: 12px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 600; width: fit-content; }
details.more[open] summary { margin-bottom: 10px; color: var(--text); }
details.more .form-grid { margin-bottom: 4px; }
.texts { display: grid; gap: 12px; margin-top: 4px; }

.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.actions .note { color: var(--muted); font-size: 12.5px; margin-left: auto; }
button.btn {
  min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  color: var(--text); font-weight: 600; cursor: pointer;
}
button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: oklch(42% 0.125 250); color: #fff; }
button.danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
button.small { min-height: 30px; padding: 4px 9px; font-size: 12.5px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; background: var(--soft); }
tbody tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12.5px; }
td .id { font-weight: 650; font-family: var(--mono); font-size: 12.5px; }
td .title { display: block; color: var(--muted); font-size: 12.5px; }
.decision { font-weight: 650; font-size: 12.5px; }
.decision[data-d="REJECT"] { color: var(--danger); }
.decision[data-d="APPROVE"] { color: var(--positive); }
.decision[data-d="ERROR"] { color: var(--warn); }
td.reason { color: var(--muted); font-size: 12.5px; max-width: 48ch; }
tr.selectable { cursor: pointer; }
tr.selectable:hover, tr.selectable[aria-selected="true"] { background: var(--accent-soft); }
tr.selectable[aria-selected="true"] td:first-child { color: var(--accent); font-weight: 650; }
.pill { display: inline-block; min-width: 24px; border-radius: 999px; background: var(--soft); padding: 1px 7px; text-align: center; font-family: var(--mono); font-size: 12px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.filters select { width: auto; min-height: 30px; padding: 3px 8px; font-size: 12.5px; }
.filters .sum { color: var(--muted); font-size: 12.5px; }
.exec-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--danger-line); border-radius: 6px; background: var(--danger-bg); }
.exec-bar b { font-size: 13px; }
.exec-bar span { color: var(--muted); font-size: 12.5px; display: block; }

/* Monitor panel */
.beacon { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.dot[data-state="running"] { background: var(--positive); box-shadow: 0 0 0 4px oklch(48% 0.09 150 / 0.18); }
.dot[data-state="finished"] { background: var(--accent); }
.dot[data-state="bad"] { background: var(--danger); }
.beacon-status { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.beacon-note { color: var(--muted); font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
.tile { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 10px 12px; }
.tile span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.tile b { font-family: var(--mono); font-size: 22px; }
.log { min-height: 220px; max-height: 50dvh; overflow: auto; border-radius: 6px; background: var(--log-bg); color: var(--log-text); font-family: var(--mono); font-size: 12.5px; line-height: 1.7; padding: 8px 0; }
.log-row { display: flex; gap: 12px; padding: 0 12px; }
.log-time { color: oklch(62% 0.025 250); flex: none; }
.log-type { color: oklch(78% 0.1 250); min-width: 20ch; flex: none; }
.log-row[data-tone="ok"] .log-type { color: oklch(80% 0.14 150); }
.log-row[data-tone="warn"] .log-type { color: oklch(82% 0.12 80); }
.log-row[data-tone="bad"] .log-type { color: oklch(72% 0.16 25); }
.log-empty { padding: 8px 12px; color: oklch(70% 0.02 250); font-family: inherit; }

/* Queues panel */
.queue-table th:nth-child(2), .queue-table td:nth-child(2) { text-align: right; width: 90px; }
.queue-table td b { font-family: var(--mono); font-size: 15px; }
.queue-table tr[data-zero="true"] td b { color: var(--muted); font-weight: 500; }
.queue-table .wf { color: var(--muted); font-size: 12.5px; }

/* Job dock: always visible, expands to show the log */
.dock {
  grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 20; border-top: 1px solid var(--line);
  background: var(--surface);
}
.dock-bar { display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 16px; }
.dock-toggle { border: 0; background: transparent; cursor: pointer; padding: 6px; color: var(--muted); font-size: 12px; }
.dock-bar .dot { width: 10px; height: 10px; }
.dock-name { font-weight: 650; font-size: 13px; }
.dock-progress { font-family: var(--mono); font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-body { display: none; max-height: 40dvh; overflow: auto; border-top: 1px solid var(--line); padding: 10px 16px 14px; }
.dock[data-open="true"] .dock-body { display: block; }
.dock[data-open="true"] .dock-body .log { min-height: 160px; max-height: 32dvh; }
.dock-history { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.dock-history li { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dock-history li:last-child { border-bottom: 0; }
.dock-history .when { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.dock-history .out { color: var(--muted); }
.dock-history li[data-status="failed"] .out { color: var(--danger); }
.dock-history li[data-status="running"] .out { color: var(--positive); }
.dock-cols { display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
.dock-cols h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .dock-cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>ScholarOne helper</h1><span>P1 · Desk</span></div>
    <div id="topStatus" class="top-status" data-tone="neutral"><span>Ready</span></div>
  </header>

  <nav class="rail" aria-label="Queues and workflows" id="rail"></nav>

  <main id="main"></main>

  <div class="dock" id="dock" data-open="false">
    <div class="dock-bar">
      <button class="dock-toggle" id="dockToggle" aria-expanded="false" aria-controls="dockBody">▲ Job</button>
      <span class="dot" id="dockDot" data-state="idle"></span>
      <span class="dock-name" id="dockName">No active job</span>
      <span class="dock-progress" id="dockProgress">Reviewers invite from CLI is running in another process. Open Monitor to follow it.</span>
      <button class="btn small" id="stopBtn" disabled>Stop</button>
    </div>
    <div class="dock-body" id="dockBody">
      <div class="dock-cols">
        <div>
          <h4>Output</h4>
          <div class="log" id="dockLog"><p class="log-empty">No active job.</p></div>
        </div>
        <div>
          <h4>Recent runs</h4>
          <ul class="dock-history" id="dockHistory"></ul>
        </div>
      </div>
    </div>
  </div>

<script>
const P = window.PROTO;
const state = { view: "screening", job: null, filter: "", selectedReport: "", events: [] };

const groups = [
  { label: "Intake", queues: ["complete-checklist"], workflows: ["reject", "screening"] },
  { label: "Editor assignment", queues: ["awaiting-eic-assignment"], workflows: ["eic"] },
  { label: "Reviewers", queues: ["assign-reviewers", "select-reviewers", "invite-reviewers"], workflows: ["reviewers"] },
  { label: "Follow-up (read only)", queues: ["awaiting-reviewer-scores", "overdue-reviewer-scores"], workflows: [] },
];
const lastRun = { reject: "dry run 00:16", screening: "dry run 00:17", eic: "dry run 31 Aug", reviewers: "running" };

function q(key) { return P.queues.find((x) => x.key === key); }
function wf(key) { return P.workflows.find((x) => x.key === key); }

function renderRail() {
  const rail = document.getElementById("rail");
  rail.replaceChildren();
  for (const g of groups) {
    const div = document.createElement("div");
    div.className = "rail-group";
    div.innerHTML = `<div class="rail-label">${g.label}</div>`;
    for (const key of g.queues) {
      const queue = q(key);
      const line = document.createElement("div");
      line.className = "queue-line";
      line.dataset.zero = String(queue.count === 0);
      line.innerHTML = `<span>${queue.label}</span><b>${queue.count}</b>`;
      div.append(line);
    }
    for (const key of g.workflows) {
      const w = wf(key);
      const btn = document.createElement("button");
      btn.className = "nav-item";
      btn.type = "button";
      btn.setAttribute("aria-current", state.view === key ? "page" : "false");
      btn.innerHTML = `<span>${w.name}</span><span class="last">${lastRun[key]}</span>`;
      btn.addEventListener("click", () => setView(key));
      div.append(btn);
    }
    rail.append(div);
  }
  const hr = document.createElement("hr");
  rail.append(hr);
  for (const [key, label] of [["monitor", "Monitor"], ["queues", "All queues"]]) {
    const btn = document.createElement("button");
    btn.className = "nav-item plain"; btn.type = "button";
    btn.setAttribute("aria-current", state.view === key ? "page" : "false");
    btn.innerHTML = `<span>${label}</span>`;
    btn.addEventListener("click", () => setView(key));
    rail.append(btn);
  }
}

function setView(view) { state.view = view; renderRail(); renderMain(); }

function fieldHtml(f) {
  const cls = `field${f.wide ? " wide" : ""}`;
  if (f.type === "select") {
    return `<label class="${cls}">${f.label}<select>${f.options.map((o) => `<option ${o === f.value ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  }
  return `<label class="${cls}">${f.label}<input type="${f.type}" value="${f.value}" placeholder="${f.placeholder || ""}"></label>`;
}

function renderWorkflow(w) {
  const queue = P.queues.find((x) => x.label === w.queue);
  const isAssessment = ["screening", "eic"].includes(w.key);
  const results = w.key === "reject" ? reportsHtml() : isAssessment ? assessmentHtml(w) : reviewersHtml();
  return `
  <section class="panel" data-active="true">
    <div class="head">
      <div><h2>${w.name}</h2><p>${w.summary}</p></div>
      <div class="queue-chip">${w.queue}<b>${queue.count}</b></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Run settings</h3><span class="sub">Saved automatically</span></div>
      <div class="form-grid">${w.fields.map(fieldHtml).join("")}</div>
      ${(w.checks || []).map((c) => `<label class="check"><input type="checkbox" ${c.checked ? "checked" : ""}>${c.label}</label>`).join("")}
      <details class="more"><summary>Advanced</summary><div class="form-grid">${w.advanced.map(fieldHtml).join("")}</div></details>
      ${w.texts.length ? `<details class="more"><summary>${w.texts.map((t) => t.label).join(" and ")}</summary><div class="texts">${w.texts.map((t) => `<label class="field">${t.label}<textarea rows="${t.rows}">${t.id === "prompt" ? P.defaultPrompt : P.defaultEmail}</textarea></label>`).join("")}</div></details>` : ""}
      <div class="actions">
        <button class="btn primary" id="dryBtn" ${state.job ? "disabled" : ""}>${w.dry}</button>
        <button class="btn danger" id="liveBtn" ${state.job ? "disabled" : ""}>${w.live}</button>
        <span class="note">${w.liveNote}</span>
      </div>
    </div>
    ${results}
  </section>`;
}

function reportsHtml() {
  return `
  <div class="card">
    <div class="card-title"><h3>Reports</h3><span class="sub">Select a dry-run report to reject from it</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Report</th><th>Status</th><th>Checked</th><th>Candidates</th><th>Progress</th></tr></thead>
      <tbody>${P.reports.map((r) => `<tr class="selectable" tabindex="0" data-id="${r.id}" aria-selected="${state.selectedReport === r.id}"><td>${P.fmtWhen(r.at)}<span class="title">${r.id}.json</span></td><td>${r.status}</td><td class="num">${r.checked}</td><td><span class="pill">${r.candidates}</span></td><td>${r.sent ? `sent ${r.sent}` : "Not started"}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="exec-bar">
      <div><b id="selName">${state.selectedReport ? `${P.reports.find((r) => r.id === state.selectedReport).candidates} candidates selected` : "No report selected"}</b><span>Rejects only the candidates listed in the report. Already-sent manuscripts are skipped.</span></div>
      <button class="btn danger" id="execBtn" ${state.selectedReport && !state.job ? "" : "disabled"}>Reject selected report</button>
    </div>
  </div>`;
}

function assessmentHtml(w) {
  const rows = P.manuscripts.filter((m) => {
    if (!state.filter) return true;
    if (state.filter === "ERROR") return m.error;
    return m.decision === state.filter;
  });
  const pending = P.manuscripts.filter((m) => m.decision && !m.action).length;
  const run = P.runs.find((r) => r.type === (w.key === "eic" ? "eic" : "screening"));
  return `
  <div class="card">
    <div class="card-title"><h3>Latest run</h3><span class="sub">${P.fmtWhen(run.at)} · ${run.mode} · <a href="#">older runs</a></span></div>
    <div class="filters">
      <select id="filterSel"><option value="">All decisions</option><option value="APPROVE" ${state.filter === "APPROVE" ? "selected" : ""}>APPROVE</option><option value="REJECT" ${state.filter === "REJECT" ? "selected" : ""}>REJECT</option><option value="ERROR" ${state.filter === "ERROR" ? "selected" : ""}>Errors</option></select>
      <span class="sum">${run.papers} papers · APPROVE ${run.approve} · REJECT ${run.reject} · errors ${run.errors}</span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Manuscript</th><th>Decision</th><th>Reason</th><th>Tokens</th><th>Action</th></tr></thead>
      <tbody>${rows.map((m) => `<tr><td><span class="id">${m.id}</span><span class="title">${m.title}</span></td><td><span class="decision" data-d="${m.decision || "ERROR"}">${m.decision || "ERROR"}</span></td><td class="reason">${m.reason}</td><td class="num">${m.tokens || "—"}</td><td>${m.action || "—"}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="exec-bar">
      <div><b>${pending} decisions ready to execute</b><span>Applies the decisions above without asking the model again. Manuscripts already handled are skipped.</span></div>
      <button class="btn danger" ${pending && !state.job ? "" : "disabled"} id="execBtn">Execute these decisions</button>
    </div>
  </div>`;
}

function reviewersHtml() {
  return `
  <div class="card">
    <div class="card-title"><h3>Current batch</h3><span class="sub">Started 00:28 from CLI · 1 of 50 papers done</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Paper</th><th>Queue</th><th>Reviewers found</th><th>Invited</th><th>State</th></tr></thead>
      <tbody>
        <tr><td><span class="id">KES-26-1198</span><span class="title">Fuzzy inference for smart grid load balancing</span></td><td>Invite Reviewers</td><td class="num">10</td><td class="num">10</td><td><span class="decision" data-d="APPROVE">verified</span></td></tr>
        <tr><td><span class="id">KES-26-1201</span><span class="title">Graph attention for supply chain anomaly detection</span></td><td>Select Reviewers</td><td class="num">7</td><td class="num">0</td><td>searching, create-account popup open</td></tr>
        <tr><td><span class="id">KES-26-1204</span><span class="title">Ensemble forecasting of PV output with weather embeddings</span></td><td>Select Reviewers</td><td class="num">—</td><td class="num">—</td><td>queued</td></tr>
      </tbody>
    </table></div>
  </div>`;
}

function monitorHtml() {
  const running = Boolean(state.job);
  return `
  <section class="panel" data-active="true">
    <div class="head"><div><h2>Monitor</h2><p>Live status of the automation script, including runs started from the CLI. Same data as the dock at the bottom, with the full event log.</p></div></div>
    <div class="beacon">
      <span class="dot" data-state="${running ? "running" : "finished"}"></span>
      <div><div class="beacon-status">${running ? "RUNNING" : "IDLE"}</div><div class="beacon-note">${running ? "Heartbeat 1 s ago · PID 13371" : "Last run finished 00:17, exit 0"}</div></div>
    </div>
    <div class="tiles">
      <div class="tile"><span>Checked</span><b>${state.events.filter((e) => e.type === "metadata_collected").length}</b></div>
      <div class="tile"><span>Decisions</span><b>${state.events.filter((e) => e.type === "llm_decision").length}</b></div>
      <div class="tile"><span>Mode</span><b style="font-size:14px">${running ? state.job.type : "—"}</b></div>
      <div class="tile"><span>Run ID</span><b style="font-size:12px">${running ? "2026-09-05T08-12-40-118Z" : "—"}</b></div>
    </div>
    <div class="log" id="monitorLog">${logRows()}</div>
  </section>`;
}

function queuesHtml() {
  return `
  <section class="panel" data-active="true">
    <div class="head"><div><h2>All queues</h2><p>Read from ScholarOne Admin Center at 23:54. The rail on the left shows the same counts next to the workflow that uses them.</p></div><button class="btn">Refresh</button></div>
    <div class="table-wrap"><table class="queue-table">
      <thead><tr><th>Queue</th><th>Count</th><th>Used by</th></tr></thead>
      <tbody>${P.queues.map((x) => `<tr data-zero="${x.count === 0}"><td>${x.label}</td><td><b>${x.count}</b></td><td class="wf">${x.workflow ? (wf(x.workflow)?.name || "Follow-up") : "ScholarOne"}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}

function logRows() {
  if (!state.events.length) return `<p class="log-empty">No run data yet.</p>`;
  return state.events.map((e) => `<div class="log-row" data-tone="${e.tone || ""}"><span class="log-time">${P.fmtTime(e.at)}</span><span class="log-type">${e.type}</span><span>${e.id ? `<b>${e.id}</b> ` : ""}${e.text}</span></div>`).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.view === "monitor") main.innerHTML = monitorHtml();
  else if (state.view === "queues") main.innerHTML = queuesHtml();
  else main.innerHTML = renderWorkflow(wf(state.view));

  main.querySelector("#dryBtn")?.addEventListener("click", () => startJob(`${wf(state.view).short} dry run`));
  main.querySelector("#liveBtn")?.addEventListener("click", () => {
    if (confirm(`${wf(state.view).liveNote}\n\nStart ${wf(state.view).live}?`)) startJob(`${wf(state.view).short} live`);
  });
  main.querySelector("#execBtn")?.addEventListener("click", () => {
    if (confirm("Execute the decisions shown in the table?")) startJob(`${wf(state.view).short} execute`);
  });
  main.querySelector("#filterSel")?.addEventListener("change", (e) => { state.filter = e.target.value; renderMain(); });
  for (const row of main.querySelectorAll("tr.selectable")) {
    const pick = () => { state.selectedReport = row.dataset.id; renderMain(); };
    row.addEventListener("click", pick);
    row.addEventListener("keydown", (e) => { if (["Enter", " "].includes(e.key)) { e.preventDefault(); pick(); } });
  }
}

function renderDock() {
  const dot = document.getElementById("dockDot");
  const name = document.getElementById("dockName");
  const progress = document.getElementById("dockProgress");
  const stop = document.getElementById("stopBtn");
  const top = document.getElementById("topStatus");
  if (!state.job) {
    dot.dataset.state = state.events.length ? "finished" : "idle";
    name.textContent = state.events.length ? "Last job finished" : "No active job";
    progress.textContent = state.events.length ? "exit 0 · batch saved to logs/screening/" : "Reviewers invite from CLI is running in another process. Open Monitor to follow it.";
    stop.disabled = true;
    top.dataset.tone = "neutral"; top.textContent = "Ready";
  } else {
    dot.dataset.state = "running";
    name.textContent = state.job.type;
    const checked = state.events.filter((e) => e.type === "metadata_collected").length;
    const dec = state.events.filter((e) => e.type === "llm_decision");
    const last = state.events.at(-1);
    progress.textContent = [`checked ${checked}`, dec.length ? `APPROVE ${dec.filter((d) => d.text.startsWith("APPROVE")).length} / REJECT ${dec.filter((d) => d.text.startsWith("REJECT")).length}` : null, last ? `${last.type}${last.id ? " " + last.id : ""}` : null].filter(Boolean).join(" · ");
    stop.disabled = false;
    top.dataset.tone = "active"; top.textContent = `${state.job.type} running`;
  }
  document.getElementById("dockLog").innerHTML = logRows();
  const log = document.getElementById("dockLog"); log.scrollTop = log.scrollHeight;
  const ml = document.getElementById("monitorLog"); if (ml) { ml.innerHTML = logRows(); ml.scrollTop = ml.scrollHeight; }
  document.getElementById("dockHistory").innerHTML = P.history.map((h) => `<li data-status="${h.status}"><span class="when">${P.fmtWhen(h.when)}</span><span>${h.label}</span><span class="out">${h.outcome}</span></li>`).join("");
  requestAnimationFrame(syncDockHeight);
}

function startJob(type) {
  state.events = [];
  state.job = { type };
  setDockOpen(true);
  state.job.ctl = P.startFakeJob({
    onEvent: (e) => { state.events.push(e); renderDock(); if (state.view === "monitor") renderMain(); },
    onDone: () => { state.job = null; renderDock(); renderMain(); },
  });
  renderMain(); renderDock();
}

// The rail is sticky with a fixed height, so it must shrink when the dock grows.
function syncDockHeight() {
  const dock = document.getElementById("dock");
  document.documentElement.style.setProperty("--dock-h", `${dock.offsetHeight}px`);
}
function setDockOpen(open) {
  const dock = document.getElementById("dock");
  dock.dataset.open = String(open);
  document.getElementById("dockToggle").setAttribute("aria-expanded", String(open));
  document.getElementById("dockToggle").textContent = open ? "▼ Job" : "▲ Job";
  syncDockHeight();
}
document.getElementById("dockToggle").addEventListener("click", () => setDockOpen(document.getElementById("dock").dataset.open !== "true"));
window.addEventListener("resize", syncDockHeight);
document.getElementById("stopBtn").addEventListener("click", () => state.job?.ctl.stop());

renderRail(); renderMain(); renderDock(); syncDockHeight();
</script>
</body>
</html>
